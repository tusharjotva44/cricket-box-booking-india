<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf5">
  <title>Owner Login | Box Book India</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .owner-login-screen{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 15%,#ffead5 0%,transparent 48%),var(--bg)}
    .owner-login-wrap{width:100%;max-width:620px}
    .owner-login-back{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px 4px;color:#7c4a32;font-size:13px;font-weight:700}
    #ownerLoginPanel{position:relative;inset:auto;background:transparent;padding:0;overflow:visible}
    #ownerLoginPanel .modal{width:100%;padding:42px 46px;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.14)}
    #ownerLoginPanel .modal h2{font-size:36px;margin:14px 0 10px}
    #ownerLoginPanel .modal form{gap:20px;margin-top:30px}
    #ownerLoginPanel .modal label{font-size:12px;gap:10px}
    #ownerLoginPanel .modal input{padding:15px 16px;font-size:15px;border-radius:11px}
    #ownerLoginPanel .modal .primary,#ownerLoginPanel .modal .outline{padding:16px;font-size:14px;border-radius:12px}
    #ownerLoginPanel .modal .fineprint{font-size:12px!important;margin-top:18px}
    @media(max-width:650px){#ownerLoginPanel .modal{padding:32px 23px;border-radius:20px}#ownerLoginPanel .modal h2{font-size:29px}#ownerLoginPanel .modal form{gap:17px;margin-top:24px}}
  </style>
</head>
<body>
  <main class="owner-login-screen">
    <div class="owner-login-wrap">
      
      <div class="modal-backdrop" id="ownerLoginPanel">
        <section class="modal" aria-labelledby="ownerLoginTitle">
          <span class="eyebrow">BOX BOOK INDIA · OWNER PORTAL</span>
          <h2 id="ownerLoginTitle">Welcome, ground owner.</h2>
          <p class="muted">Sign in to manage your ground, bookings and subscription, or create a new owner account.</p>
          <form id="ownerLoginForm">
            <label>Email<input id="ownerEmail" type="email" placeholder="owner@example.com" autocomplete="email" required></label>
            <label>Password<input id="ownerPassword" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6"></label>
            <button class="primary full" id="ownerAuthSubmit" type="submit">Login to Dashboard →</button>
          </form>
          <button class="outline full" id="ownerAuthToggle" type="button">New User? Create account</button>
          <p id="ownerAuthMessage" class="fineprint" aria-live="polite"></p>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="firebase-init.js"></script>
  <script src="owner-login.js"></script>
</body>
</html>
